<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="연서와 예서의 탕후루·급식·파르페 만들기 라이브 먹방 게임">
<meta name="theme-color" content="#ffb3d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="디저트 방송국">
<meta property="og:title" content="연서 &amp; 예서의 라이브 디저트 방송국">
<meta property="og:description" content="탕후루·급식·파르페를 만들고 먹방하는 우리 집 게임">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>연서 &amp; 예서의 라이브 디저트 방송국</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-weight:700;color:#4a2b1a;
  background:radial-gradient(circle at 20% 10%,#fff6d8 0,transparent 45%),radial-gradient(circle at 85% 90%,#ffd3e2 0,transparent 50%),#ffe9c9;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;font-weight:800;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{--ps:clamp(30px,6.4vh,54px);height:100vh;height:100dvh;max-width:920px;margin:0 auto;display:flex;flex-direction:column;position:relative}

/* 상단바 */
#top{display:flex;gap:8px;align-items:center;padding:8px 10px;flex:none}
.tb{background:#fff;border-radius:14px;padding:8px 12px;font-size:clamp(12px,1.9vh,15px);box-shadow:0 3px 0 #e2b98f;white-space:nowrap}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 #e2b98f}
.tb.sq{margin-left:auto}
#main{flex:1;min-height:0;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px;overflow-y:auto}
.pa{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative}
.pb{flex:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;width:100%}

.btn{background:#ff5c8a;color:#fff;border-radius:18px;padding:.7em 1.1em;font-size:clamp(14px,2.3vh,19px);box-shadow:0 5px 0 #c93a66;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c93a66}
.btn.alt{background:#ffb81f;box-shadow:0 5px 0 #d18d00;color:#4a2b1a}
.btn.green{background:#35c76f;box-shadow:0 5px 0 #1f9a50}
.btn.ghost{background:#fff;color:#4a2b1a;box-shadow:0 5px 0 #e2b98f}
.btn:disabled{background:#d9cfc6;box-shadow:0 5px 0 #b9aea4;color:#fff;cursor:default;transform:none}
.msg-line{min-height:1.5em;font-size:clamp(13px,2.1vh,17px);text-align:center;color:#a2462a}

/* 로비 */
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.studio{position:relative;height:clamp(110px,24vh,210px);aspect-ratio:200/215}
.studio .mic{position:absolute;right:-18%;bottom:0;font-size:clamp(30px,7vh,56px);animation:bob 1.6s infinite alternate ease-in-out}
.onair{background:#ff3b3b;color:#fff;border-radius:99px;padding:2px 12px;font-size:12px;letter-spacing:.08em;animation:blink 1.2s infinite}
h1{font-size:clamp(22px,4.6vh,40px);color:#e63b72;text-shadow:0 2px 0 #fff}
.sub{font-size:clamp(12px,1.9vh,15px);font-weight:600;opacity:.8}
.prog{background:#fff;border-radius:99px;padding:5px 16px;font-size:clamp(13px,2vh,16px);box-shadow:inset 0 0 0 2px #ffd08a}
.prog b{color:#e63b72}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.mode{border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:#fff;line-height:1.25}
.mode .em{font-size:clamp(34px,7vh,60px)}
.mode b{font-size:clamp(14px,2.4vh,19px)}
.mode small{font-size:clamp(11px,1.7vh,13px);font-weight:600;opacity:.95}
.mode .mt{display:flex;flex-direction:column;align-items:inherit;gap:4px}
.mode.tang{background:linear-gradient(160deg,#ff7aa5,#ff4d7d);box-shadow:0 6px 0 #c93a66}
.mode.lunch{background:linear-gradient(160deg,#ffc13d,#ff9a1f);box-shadow:0 6px 0 #cc7400}
.mode:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}

/* 목표 핀 */
.pin{background:#fffbe6;border:2px dashed #ffb81f;border-radius:14px;padding:5px 12px;font-size:clamp(12px,1.9vh,15px);text-align:center;flex:none}

/* 꼬치 */
.skewer{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding-bottom:calc(var(--ps)*.9)}
.skewer .stick{position:absolute;left:50%;top:-8px;bottom:0;width:7px;margin-left:-3.5px;border-radius:4px;background:linear-gradient(90deg,#edd29a,#c49a52)}
.pieces{position:relative;display:flex;flex-direction:column-reverse;justify-content:flex-start;height:calc(var(--ps)*4.2);min-width:calc(var(--ps)*1.3)}
.piece{position:relative;font-size:var(--ps);line-height:1.05;height:1.05em;width:1.3em;text-align:center}
.piece.drop{animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
.glazed::after{content:"";position:absolute;inset:3% 10%;border-radius:50%;
  background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.4) 8% 22%,rgba(255,255,255,0) 42%),radial-gradient(circle at 60% 72%,rgba(255,220,150,.05),rgba(255,186,80,.3));
  box-shadow:inset 0 0 .12em rgba(255,255,255,.95),0 0 .12em rgba(255,205,120,.95);-webkit-backdrop-filter:saturate(1.3) brightness(1.08);backdrop-filter:saturate(1.3) brightness(1.08)}
.glazed::before{content:"✨";position:absolute;right:-.2em;top:-.05em;font-size:.36em;animation:twinkle 1s infinite alternate;z-index:2}
.skewer.flip{transform:rotate(180deg)}
.flip .piece{transform:rotate(180deg)}

/* 재료 트레이 */
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:rgba(255,255,255,.75);border-radius:20px;padding:8px;width:100%}
.ing{background:#fff;border-radius:14px;width:clamp(44px,12.2vw,70px);padding:4px 0 3px;box-shadow:0 3px 0 #e8c9a4;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ing span{font-size:clamp(22px,4.4vh,34px)}
.ing small{font-size:clamp(9px,1.4vh,12px);font-weight:700;white-space:nowrap}
.ing:active{transform:translateY(2px) scale(.95)}
.ing.base{background:#fff4c9}
.ing.on{background:#ffe0ea;box-shadow:0 0 0 3px #ff5c8a}
.ing.wide{width:clamp(70px,21vw,120px)}
.tray-title{width:100%;text-align:center;font-size:clamp(12px,1.8vh,14px);color:#a2462a}

/* 식판 */
.lunchtray{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#cfd8dc;border-radius:22px;padding:10px;width:min(100%,460px);box-shadow:inset 0 3px 0 #eef3f5,0 5px 0 #9aa7ad}
.slot{background:#eef3f5;border-radius:16px;min-height:clamp(96px,20vh,160px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:6px;box-shadow:inset 0 3px 6px rgba(0,0,0,.12)}
.slot.act{box-shadow:inset 0 0 0 3px #ff5c8a}
.slot small{font-size:11px;opacity:.6}
.slot b{font-size:clamp(12px,1.9vh,15px)}
.slot .mix{font-size:clamp(20px,4vh,32px);min-height:1.2em}
.slot .dish{font-size:clamp(30px,6.5vh,54px)}
.morph{animation:morph .6s cubic-bezier(.3,1.6,.5,1)}

/* 조리 */
.steps{display:flex;gap:6px;font-size:clamp(11px,1.7vh,14px);flex:none;justify-content:center;flex-wrap:wrap}
.steps i{font-style:normal;background:#fff;border-radius:99px;padding:3px 10px;opacity:.5}
.steps i.on{opacity:1;background:#ff5c8a;color:#fff}
.kitchen{display:flex;flex-direction:column;align-items:center;position:relative}
.dipper{position:relative;z-index:1;--ps:clamp(26px,5vh,44px)}
.dipper.dip{animation:dip 1.8s ease-in-out}
.pot{position:relative;z-index:2;width:min(52vw,230px);height:clamp(64px,13vh,112px);border:5px solid #6d7780;border-top:0;border-radius:0 0 38px 38px;background:rgba(222,228,233,.92);overflow:hidden;margin-top:-6px}
.syrup{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#fff,#eaf6ff);opacity:.9;transition:height .4s,background .6s}
.syrup.hot{background:linear-gradient(#ffe9a8,#ffc94d)}
.syrup.done{background:linear-gradient(#ffd66b,#f5a623)}
.bub{position:absolute;bottom:4px;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.95);animation:rise 1s infinite ease-in}
.flame{font-size:clamp(18px,3.4vh,28px);height:1.2em;letter-spacing:2px;animation:flick .2s infinite alternate}
.gauge{position:relative;width:min(92%,420px);height:26px;border-radius:99px;background:linear-gradient(90deg,#8fd0ff 0 55%,#35c76f 55% 78%,#ff5a4d 78% 100%);box-shadow:inset 0 2px 4px rgba(0,0,0,.2);flex:none}
.gauge #ptr{position:absolute;top:-7px;left:0;width:8px;height:40px;margin-left:-4px;background:#4a2b1a;border-radius:4px;border:2px solid #fff}
.glabels{display:flex;width:min(92%,420px);font-size:11px;flex:none}
.glabels span:nth-child(1){width:55%;text-align:center;color:#2f7fb8}
.glabels span:nth-child(2){width:23%;text-align:center;color:#1f9a50}
.glabels span:nth-child(3){width:22%;text-align:center;color:#d43a2e}
.cookers{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(100%,460px)}
.cooker{position:relative;background:#fff;border-radius:20px;padding:8px;text-align:center;box-shadow:0 5px 0 #e2b98f;overflow:hidden}
.cooker .cap{font-size:12px;opacity:.6}
.cooker .cf{font-size:clamp(34px,8vh,64px);display:inline-block;position:relative}
.cooker.cooking .cf{animation:wob .35s infinite alternate}
.cooker .melt{position:absolute;left:24%;right:24%;top:40%;height:calc(4% + var(--m)*20%);background:#ffd23f;opacity:.8;border-radius:45% 45% 50% 50%/25% 25% 75% 75%;transition:height .3s}
.cooker .steam{position:absolute;top:2px;right:8px;font-size:18px;animation:bob .8s infinite alternate}
.cooker b{display:block;font-size:clamp(12px,1.9vh,15px)}
.pbar{width:min(92%,420px);height:16px;background:#fff;border-radius:99px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb81f,#ff5c8a);transition:width .25s}

/* 먹방 */
.live{flex:1;min-height:0;display:flex;gap:8px;width:100%}
.cam{flex:1.25;min-width:0;position:relative;background:linear-gradient(#ffd9e6,#ffeef4);border-radius:20px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:inset 0 0 0 3px #fff}
.cam .lulu{height:88%;max-height:300px;max-width:100%;aspect-ratio:200/215;transition:transform .2s}
.livebadge{position:absolute;top:6px;left:6px;background:#ff3b3b;color:#fff;border-radius:8px;padding:2px 7px;font-size:11px;z-index:3}
.livebadge span{background:rgba(0,0,0,.25);border-radius:6px;padding:0 5px;margin-left:4px}
.say{position:absolute;top:8px;right:6px;max-width:62%;background:#fff;border-radius:14px 14px 14px 2px;padding:5px 9px;font-size:clamp(12px,1.9vh,15px);z-index:3;box-shadow:0 2px 0 #f3b6c9}
.fullicon{position:absolute;left:6px;bottom:6px;background:#fff;border-radius:10px;padding:2px 7px;font-size:12px;opacity:0;z-index:3}
.fullicon.on{opacity:1;animation:blink .4s infinite}
.chat{flex:1;min-width:0;background:rgba(40,28,48,.86);border-radius:20px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;overflow:hidden;color:#fff;font-weight:600}
.chat .cm{font-size:clamp(11px,1.7vh,13px);line-height:1.3;animation:chatin .25s}
.chat .cm b{margin-right:4px}
.table{display:flex;align-items:flex-end;justify-content:center;gap:clamp(14px,6vw,50px);width:100%;background:linear-gradient(#f3d3a6,#e6bb83);border-radius:20px;padding:8px 10px 6px;flex:none}
.food{display:flex;gap:10px;align-items:flex-end;justify-content:center;position:relative}
.food.dunk{animation:dunk .7s ease-in-out}
.tapfood{background:none;display:flex;flex-direction:column;align-items:center}
.tapfood small,.cup small{font-size:11px;color:#7a4a25;margin-top:2px}
.plate{background:#fff;border-radius:18px;width:clamp(86px,26vw,140px);padding:6px 4px;text-align:center;box-shadow:0 4px 0 #c9a06b}
.plate:active{transform:translateY(2px)}
.plate .pf{font-size:clamp(28px,6vh,48px);display:inline-block;transition:transform .2s;line-height:1.2}
.plate b{display:block;font-size:clamp(11px,1.7vh,13px)}
.plate i{font-style:normal;font-size:11px;color:#ff5c8a;letter-spacing:2px}
.cup{background:none;display:flex;flex-direction:column;align-items:center}
.glass{position:relative;width:clamp(44px,11vw,62px);height:clamp(70px,14vh,104px);border:4px solid #7fb2c8;border-top:0;border-radius:0 0 14px 14px;background:rgba(255,255,255,.45);overflow:hidden}
.glass i{position:absolute;left:0;right:0;bottom:0;transition:height .7s}
.cup.need .glass{animation:nudge .35s infinite alternate;box-shadow:0 0 0 4px #ff5c8a}
.cup.shake .glass{animation:shake .12s 7}
.note{width:100%;text-align:center;font-size:clamp(13px,2vh,16px);color:#a2462a}
#eatctl{min-height:clamp(44px,8vh,60px)}

/* 루 캐릭터 */
.lulu svg{width:100%;height:100%;display:block;overflow:hidden;animation:idle 1.8s ease-in-out infinite alternate}
.l-eyes{transform-box:fill-box;transform-origin:center;animation:blinkeye 4.2s infinite}
.l-happy,.l-hot,.l-tear{opacity:0}
.open .l-eyes{opacity:0}.open .l-happy{opacity:1}
.spicy .l-eyes,.spicy .l-happy{opacity:0}.spicy .l-hot{opacity:1}
.spicy .l-tear{opacity:1;animation:bob .3s infinite alternate}
.l-smile{transition:opacity .08s}
.open .l-smile,.spicy .l-smile{opacity:0}
.l-mouth{transform-box:fill-box;transform-origin:center;transform:scale(.3);opacity:0;transition:transform .12s,opacity .08s}
.spicy .l-mouth{transform:scale(1.1);opacity:1}
.open .l-mouth{transform:scale(1.5,1.6);opacity:1}
.l-cheek{transform-box:fill-box;transform-origin:center;transition:transform .25s}
.full .l-cheek{transform:scale(2)}
.lulu.full{transform:scaleX(1.1)}
.l-face{transition:fill .3s}
.spicy .l-face{fill:#ff8d70}
.l-fire{opacity:0}
.spicy .l-fire{opacity:1;animation:flick .2s infinite alternate}
.l-cheese{transform-box:fill-box;transform-origin:top center;transform:scaleY(0)}
.cheese .l-cheese{animation:stretch 1.1s ease-out}
@keyframes idle{from{transform:translateY(0)}to{transform:translateY(-1.5%)}}
@keyframes blinkeye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* 도감 */
.ov{position:absolute;inset:0;background:rgba(60,30,20,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
.panel{background:#fff8ec;border-radius:24px;width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column;padding:12px;gap:8px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.phead{display:flex;align-items:center;gap:8px}
.phead h2{font-size:clamp(17px,3vh,24px);color:#e63b72}
.phead span{font-size:13px;background:#fff;border-radius:99px;padding:2px 10px}
.phead button{margin-left:auto;background:#ff5c8a;color:#fff;border-radius:12px;width:38px;height:38px;font-size:16px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;background:#fff;border-radius:12px;padding:8px 4px;font-size:clamp(12px,2vh,15px);box-shadow:0 3px 0 #e2b98f}
.tabs button.on{background:#ffb81f;box-shadow:0 3px 0 #d18d00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;overflow-y:auto;padding:2px 2px 6px}
.rc{background:#fff;border-radius:16px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 0 #e2b98f;line-height:1.3}
.rc .ri{font-size:clamp(30px,6vh,44px)}
.rc b{font-size:clamp(12px,1.9vh,15px)}
.rc .fm{font-size:clamp(12px,1.8vh,15px);font-weight:600}
.rc .go{font-size:11px;background:#ff5c8a;color:#fff;border-radius:99px;padding:3px 9px;margin-top:2px}
.rc.lock{background:#efe6dc;box-shadow:0 4px 0 #cdbfb0;cursor:default}
.rc.lock .ri{filter:grayscale(1) brightness(0);opacity:.75}
.rc.lock .fm{color:#8a6a55}

/* 클리어 */
.clear .panel{align-items:center;text-align:center;gap:10px;padding:18px 14px}
.clear h2{font-size:clamp(20px,4vh,32px);color:#e63b72}
.badge{background:#fff;border-radius:18px;padding:10px 16px;box-shadow:inset 0 0 0 3px #ffb81f;font-size:clamp(13px,2.1vh,17px)}
.badge .ri{font-size:clamp(36px,8vh,60px);display:block;animation:morph .7s cubic-bezier(.3,1.6,.5,1)}

/* 상단바 · 미션 · 채팅 · 상점 (개인화 에디션) */
#top{overflow-x:auto;gap:6px}
.tb{flex:none;padding:7px 9px}
.tb.coin{display:flex;align-items:center;gap:5px}
.plus{font-size:10px;background:#ffe9a8;border-radius:8px;padding:3px 5px;color:#7a5200}
@media (max-width:680px){.tb span{display:none}}
.bar{flex:none}
.livebar{background:#2b1b33;color:#fff;border-radius:10px;padding:3px 10px;font-size:clamp(11px,1.7vh,14px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{background:#fff;border:2px solid #ff5c8a;border-radius:14px;padding:4px 10px;font-size:clamp(10px,1.6vh,13px);text-align:center;line-height:1.3;color:#e63b72}
.mbar b{color:#4a2b1a;font-size:clamp(12px,1.9vh,15px)}
.mbar i{font-style:normal}
.mbar.hot{border-color:#ffb81f;background:#fffbe6;color:#b97a00}
.ticker{flex:none;font-size:clamp(11px,1.7vh,13px);background:rgba(40,28,48,.82);color:#fff;border-radius:10px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.chat .cm{animation:none;cursor:pointer}
.chat .cm:last-child{animation:chatin .25s}
.chat .cm.gift{background:linear-gradient(90deg,#ffe27a,#ffc93d);color:#4a2b1a;border-radius:8px;padding:3px 6px;font-weight:800}
.chat.strip{flex:none;width:100%;height:clamp(50px,10vh,84px);border-radius:14px;padding:5px 8px}
.nametag{background:linear-gradient(90deg,#fff3a8,#ffd54a,#fff,#ffd54a,#fff3a8);background-size:200% 100%;animation:shine 2.2s linear infinite;border-radius:99px;padding:2px 12px;font-size:clamp(11px,1.7vh,14px);box-shadow:0 2px 0 #d9a400;white-space:nowrap}
.cam .nametag{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);z-index:3}
.cam .mic{position:absolute;right:4px;bottom:4px;font-size:clamp(22px,4.5vh,34px);z-index:3}
.cam .lulu{margin-bottom:14px}
.fullicon{bottom:auto;top:30px}
.mic i{position:absolute;font-style:normal;font-size:.45em;top:-.15em;right:-.2em;animation:twinkle .8s infinite alternate}
.goldmic{display:inline-block;filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 6px #ffd54a)}
.lobby h1{font-size:clamp(17px,3.3vh,30px);line-height:1.25}
.stagebox{position:relative;border-radius:24px;padding:8px 44px 0;box-shadow:inset 0 0 0 3px #fff,0 4px 0 #f3b6c9;overflow:hidden}
.stagebox .onair{position:absolute;left:8px;top:8px;z-index:2}
.stagebox .studio{height:clamp(96px,21vh,190px)}
.stagebg{background:linear-gradient(#ffd9e6,#ffeef4)}

function visualOf(ings){
  const has = function(x){ return ings.indexOf(x) >= 0; };
  const fruit = has('strawberry') ? 'strawberry' : has('grape') ? 'grape' : has('melon') ? 'melon' : null;
  const milkCol = fruit==='strawberry' ? '#ffc0d4' : fruit==='grape' ? '#cdb0f0' : fruit==='melon' ? '#c8ecb0' : '#fffdf5';
  const cheese = has('cheese');
  if(has('ramen')) return {t:'ramen', broth:has('hot') ? '#e2452f' : has('milk') ? milkCol : '#f2a23a', cheese:cheese, hot:has('hot'), fruit:fruit, tool:'chop'};
  if(has('cereal')) return {t:'cereal', broth:milkCol, fruit:fruit, tool:'spoon'};
  if(has('cutlet')) return {t:'cutlet', cheese:cheese, tool:'fork'};

  if(has('potato') && has('pepper')) return {t:'japchae', tool:'chop'};
  if(has('potato') && has('ice')) return {t:'naeng', tool:'chop'};
  return null;
}

/* ============ 음성 읽어주기 (Web Speech API) ============ */
const TTS_OK = ('speechSynthesis' in window) && (typeof SpeechSynthesisUtterance !== 'undefined');
let koVoice = null;
let vName = lsGet('lulu_vname', ''), vTone = lsGet('lulu_vtone', 'soft');
function koVoices(){ try { return speechSynthesis.getVoices().filter(function(v){ return /^ko/i.test(v.lang); }); } catch(e){ return []; } }
// 기기에 있는 한국어 목소리 중 사람 목소리에 가까운 고품질 음성을 먼저 고름
function vScore(v){
  return (/natural|neural|online|premium|enhanced|고품질|프리미엄/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0)
    + (/yuna|sora|유나|소라|sunhi|heami|female|여성/i.test(v.name) ? 1 : 0);
}
function loadVoice(){
  const vs = koVoices();
  koVoice = vs.find(function(v){ return v.name === vName; }) || vs.slice().sort(function(a, b){ return vScore(b) - vScore(a); })[0] || null;
}
if(TTS_OK){ loadVoice(); try { speechSynthesis.addEventListener('voiceschanged', function(){ loadVoice(); if(document.getElementById('voicepanel')) drawVoice(); }); } catch(e){} }
function cleanSpeech(t){
  return String(t).replace(/<[^>]+>/g, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/[ㅋㅠㅎ]+/g, '').replace(/[\[\]|·]/g, ' ').replace(/~/g, '').trim();
}
function deviceSpeak(t){
  if(!voiceOn || !TTS_OK) return;
  try {
    const txt = cleanSpeech(t);
    speechSynthesis.cancel();                       // 이전 음성이 밀리지 않게 먼저 끊기
    if(!txt) return;
    if(!koVoice) loadVoice();
    // 아이폰·아이패드는 손가락으로 누른 바로 그 순간에만 음성을 허용하므로 지연 없이 바로 재생
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'ko-KR'; if(koVoice) u.voice = koVoice;
    if(vTone === 'cute'){ u.pitch = 1.35; u.rate = 1.1; } else { u.pitch = 1.12; u.rate = 0.97; }   // 귀엽게(높은 톤) / 부드럽게(자연스러운 톤)
    u.volume = 1;
    speechSynthesis.speak(u);
    if(speechSynthesis.paused) speechSynthesis.resume();
  } catch(e){}
}
function voiceProblem(){
  if(!TTS_OK) return '이 브라우저는 음성 읽어주기를 지원하지 않아요';
  loadVoice();
  try { if(speechSynthesis.getVoices().length && !koVoice) return '이 기기에 한국어 음성이 설치되어 있지 않아요'; } catch(e){}
  return '';
}

function decodeGem(d){
  const a = ac(); if(!a) throw new Error('이 브라우저에서 소리를 재생할 수 없어요');
  const bin = atob(d.data), n = bin.length, u8 = new Uint8Array(n);
  for(let i=0;i<n;i++) u8[i] = bin.charCodeAt(i);
  if(n > 12 && bin.slice(0,4) === 'RIFF') return new Promise(function(res, rej){ a.decodeAudioData(u8.buffer, res, rej); });   // WAV
  const m = /rate=(\d+)/.exec(d.mimeType || ''), rate = m ? parseInt(m[1], 10) : 24000;                                        // 헤더 없는 16비트 PCM
  const len = n >> 1, buf = a.createBuffer(1, Math.max(1, len), rate), ch = buf.getChannelData(0), dv = new DataView(u8.buffer);
  for(let i=0;i<len;i++) ch[i] = dv.getInt16(i*2, true) / 32768;
  return Promise.resolve(buf);
}

function idbGet(k){

    if(!gemDB) return res(null);

function gemPost(model, body){
  return fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent', {
      method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':gemKey}, body:JSON.stringify(body)
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){
          const er = j.error || {}, e = new Error(er.message || ('HTTP ' + r.status));
          e.status = r.status; e.reason = ((er.details || []).map(function(d){ return d.reason || ''; }).join(' ') + ' ' + (er.status || '')).trim();
          throw e;
        }
        return j;
      });
    });
}
function gemCall(txt){
  // Gemini 3.8 TTS 공식 형식: 말투는 speechMetadata.style, 목소리는 speechConfig.voiceConfig.voice
  const b1 = {contents:[{role:'user', parts:[{text:txt, speechMetadata:{style:gemStyle()}}]}],
              generationConfig:{responseModalities:['AUDIO'], speechConfig:{voiceConfig:{voice:gemVoice}}}};
  // 형식이 맞지 않는다는 400 오류가 오면, 말투 없이 가장 기본 형식으로 한 번 더 시도
  const b2 = {contents:[{role:'user', parts:[{text:txt}]}],
              generationConfig:{responseModalities:['AUDIO'], speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:gemVoice}}}}};
  const keyIssue = function(e){ return /key|referer|referrer|location|region|PERMISSION|QUOTA|RESOURCE/i.test(e.message + ' ' + (e.reason||'')); };
  return gemPost(gemModel, b1).catch(function(e){
    if(e.status === 400 && !keyIssue(e)) return gemPost(gemModel, b2);
    if(e.status === 404 && gemModel !== 'gemini-3.8-flash-tts') return gemPost('gemini-3.8-flash-tts', b1);
    throw e;
  }).then(function(j){
    const parts = ((((j.candidates || [])[0] || {}).content || {}).parts) || [];
    const p = parts.find(function(x){ return x.inlineData && x.inlineData.data; });
    if(!p){ const fr = ((j.candidates || [])[0] || {}).finishReason; throw new Error('음성 데이터가 오지 않았어요' + (fr ? ' (' + fr + ')' : '')); }
    return {mimeType:p.inlineData.mimeType || '', data:p.inlineData.data};
  });
}
function gemFetch(txt){
  const k = gemModel + '|' + gemVoice + '|' + vTone + '|' + txt;
  if(gemCache.has(k)) return gemCache.get(k);
  const pr = idbGet(k).then(function(hit){
    if(hit && hit.data) return decodeGem(hit);
    return gemCall(txt).then(function(clip){ idbPut(k, clip); return decodeGem(clip); });
  });
  gemCache.set(k, pr);
  pr.catch(function(){ gemCache.delete(k); });
  return pr;
}

  const raw = st ? ' (오류 ' + st + (rs ? ' ' + rs : '') + ')' : '';

  if(st === 429 || /quota|RESOURCE_EXHAUSTED/i.test(all)) return '사용 한도를 넘었어요. 잠시 뒤 다시 해 보거나 AI Studio에서 요금제·한도를 확인해 주세요' + raw;
  if(/location|region|country|not supported in your/i.test(all)) return '이 지역에서는 이 모델을 쓸 수 없다고 해요' + raw;
  if(st === 403 || /PERMISSION_DENIED|SERVICE_DISABLED|not enabled|has not been used/i.test(all)) return '이 키로는 이 모델을 쓸 수 없어요. AI Studio에서 새 키를 만들어 주세요' + raw;
  if(st === 404) return '모델을 찾지 못했어요. AI 설정에서 다른 모델을 골라 보세요' + raw;

let AC = null, muted = false, MG = null;
function master(a){ if(!MG){ MG = a.createGain(); MG.gain.value = 0.5; MG.connect(a.destination); } return MG; }  // 음성이 또렷하게 들리도록 효과음은 조금 작게
function ac(){

    if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
    if(AC.state === 'suspended') AC.resume();
  }catch(e){ return null; }

}
function tone(f, d, type, v, t0, f2){
  const a = ac(); if(!a) return;
  const t = a.currentTime + (t0||0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(v || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master(a)); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v, ftype, freq, t0, q, f2){
  const a = ac(); if(!a) return;
  const t = a.currentTime + (t0||0), len = Math.max(1, Math.floor(a.sampleRate * d));
  const buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i] = Math.random()*2 - 1;
  const s = a.createBufferSource(); s.buffer = buf;
  const fl = a.createBiquadFilter(); fl.type = ftype || 'highpass'; fl.frequency.setValueAtTime(freq || 2000, t); fl.Q.value = q || 1;
  if(f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
  const g = a.createGain(); g.gain.setValueAtTime(v || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(fl); fl.connect(g); g.connect(master(a)); s.start(t); s.stop(t + d + 0.03);
}

function handleImg(file, c){
  if(!file) return;
  const fail = function(t){ const m = $('#selmsg'); if(m) m.textContent = t; SFX.buzz(); };
  const fr = new FileReader();
  fr.onerror = function(){ fail('그림 파일을 읽지 못했어요'); };
  fr.onload = function(){
    const im = new Image();
    im.onerror = function(){ fail('그림 파일이 아니에요. 사진이나 그림 파일을 골라 주세요'); };
    im.onload = function(){
      try {
        const sc = Math.min(1, 420 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.width * sc)); cv.height = Math.max(1, Math.round(im.height * sc));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        let url = cv.toDataURL('image/png');
        if(url.length > 900000) url = cv.toDataURL('image/jpeg', .85);
        localStorage.setItem('lulu_img_' + c, url);
        SFX.jingle(); if(S.screen==='select') render();
      } catch(e){ fail('이 기기에 그림을 저장하지 못했어요 (저장 공간 부족)'); }
    };
    im.src = fr.result;
  };

function addIng(id){
  if(foodReady()) return;

    S.skewer.push(id); S.dropIdx = S.skewer.length - 1;

  } else {
    const i = S.dishes[0] ? 1 : 0, slot = S.slots[i];
    if(slot.indexOf(id) >= 0){ SFX.buzz(); S.pmsg = '같은 재료는 한 번만 넣을 수 있어요!'; render(); return; }
    slot.push(id); S.pmsg = '';
    const hit = DISH_BY_KEY[dishKey(slot)];
    const canGrow = Object.keys(DISH).some(function(k){ const of = DISH[k].of; return of.length > slot.length && slot.every(function(x){ return of.indexOf(x) >= 0; }); });
    if(hit){ S.dishes[i] = hit; S.newDish = i; SFX.pop(); SFX.jingle(); }
    else if(!canGrow){ S.dishes[i] = MYSTERY; S.newDish = i; SFX.splash(); }
    else SFX.pop();
  }
  if(foodReady()) chat(pick(CHAT.picked));
  render();
}

  }, 400);

function bite(i, dunked){
  if(S.ended || S.busy) return;
  if(S.spicy){ say('으아 매워! 음료 먼저! 🥵'); SFX.buzz(); return; }
  let cheese = false, spicy = false;
  if(S.mode==='tang'){
    if(!S.bites.length) return;
    const id = S.bites.pop(); cheese = !!ING[id].cheese; spicy = !!ING[id].spicy;
    SFX.crunch();
  } else if(S.mode==='parfait'){
    if(!S.bites.length) return;
    const id = S.bites.pop(), L = LAYER[id] || LAYER.cream;
    if(L.k==='chunk') SFX.crunch(); else { SFX.pop(); later(SFX.gulp, 120); }
    if(L.k==='cream') later(function(){ yum(900); }, 450);
  } else {
    if(i==null || isNaN(i) || S.left[i] <= 0) i = S.left[0] > 0 ? 0 : 1;
    if(S.left[i] <= 0) return;
    const d = S.dishes[i]; S.left[i]--; cheese = !!d.cheese; spicy = !!d.spicy && S.left[i]===2;
    SFX.slurp();
  }
  const L = $('#lulu');
  mouth(); chew();
  say(dunked ? (S.mode==='parfait' ? '바닥까지 싹싹~ 냠! 😋' : '푹 찍어서… 냠~! 😋') : pick(S.mode==='tang' ? ['와삭!','바삭!','아삭아삭!'] : S.mode==='parfait' ? ['냠~ 사르르!','폭신폭신!','달콤해~','차가워~ 맛있어!'] : ['호로록!','냠냠!','후루룩~']));
  if(EFX[equip.ef]) confetti(8, EFX[equip.ef]);
  if(cheese){
    L.classList.remove('cheese'); void L.offsetWidth; L.classList.add('cheese');
    later(function(){ L.classList.remove('cheese'); }, 1150);
    say('치즈가 쭈~욱! 🧀'); chat(pick(CHAT.cheese));
  }
  if(spicy){
    S.spicy = true; L.classList.add('spicy'); SFX.fire();
    say('으아아 매워!! 🔥'); chat(pick(CHAT.spicy)); speakLite('앗 매워!');
  }
  if(dunked) emDone('dunk');
  if(Math.random() < .45) chat(pick(CHAT.bite));
  S.biteTimes.push(Date.now());
  if(S.biteTimes.length >= 3 && S.biteTimes[S.biteTimes.length-1] - S.biteTimes[S.biteTimes.length-3] <= 3000) emDone('fast');
  const now = Date.now();
  S.combo = (now - S.lastBite < 900) ? S.combo + 1 : 0; S.lastBite = now;
  if(S.combo >= 2){
    S.combo = 0; L.classList.add('full'); $('#fullicon').classList.add('on');
    say('우물우물… 볼이 빵빵해! 🐹'); chat(pick(CHAT.full));
    later(function(){ L.classList.remove('full'); const f = $('#fullicon'); if(f) f.classList.remove('on'); }, 2600);
  }
  drawFood(); drawCup(); drawCtl(); checkEnd();
}

  blow(){

let DG = null;
const KIND_SCREEN = {ing:'pick', sugar:'cook', water:'cook', dip:'cook', spoon:'cook', food:'eat', cup:'eat'};
function ptIn(el, x, y, pad){ const r = el.getBoundingClientRect(); pad = pad || 0; return x >= r.left-pad && x <= r.right+pad && y >= r.top-pad && y <= r.bottom+pad; }
function dropAt(kind, x, y){
  return Array.prototype.find.call(document.querySelectorAll('[data-drop]'), function(el){
    return el.dataset.drop.split(' ').indexOf(kind) >= 0 && ptIn(el, x, y, 14);
  }) || null;
}
function targetPoint(kind){
  let el, fy = .5;
  if(kind==='ing'){ if(S.mode==='tang'){ el = $('.pieces'); fy = .15; } else if(S.mode==='parfait'){ el = $('.pglass'); fy = .35; } else el = $('.slot.act') || $('.lunchtray'); }
  else if(kind==='sugar' || kind==='water') el = $('.pot');
  else if(kind==='spoon') el = $('.cookers') || $('.whipbowl');
  else { el = $('#lulu'); fy = .68; }
  if(!el) return null;
  const r = el.getBoundingClientRect();
  return {x:r.left + r.width/2, y:r.top + r.height*fy};
}
function doDrop(d){
  if(S.screen !== KIND_SCREEN[d.kind]) return;
  if(d.kind==='ing') addIng(d.id);
  else if(d.kind==='sugar') ACT.sugar();
  else if(d.kind==='water') ACT.water();
  else if(d.kind==='dip') ACT.dip();
  else if(d.kind==='spoon') ACT.stir();
  else if(d.kind==='food') bite(d.i === undefined ? null : parseInt(d.i, 10), false);
  else if(d.kind==='cup') sip();
}

document.addEventListener('pointermove', function(ev){

  const x = ev.clientX, y = ev.clientY;
  if(!d.moved && Math.hypot(x-d.x0, y-d.y0) > 10) d.moved = true;
  if(d.self){ if(d.moved) d.src.style.transform = 'translate(' + (x-d.x0) + 'px,' + (y-d.y0) + 'px)'; return; }
  if(d.ghost){ d.ghost.style.left = x + 'px'; d.ghost.style.top = y + 'px'; }
  if((d.kind==='food' || d.kind==='cup') && !S.spicy) mouthHint(!!dropAt(d.kind, x, y));
  if(d.kind==='spoon' && dropAt('spoon', x, y)){
    d.acc += Math.hypot(x-d.lx, y-d.ly);
    if(d.acc >= 120){
      d.acc = 0; ACT.stir();
      if(!stirOn()){ DG = null; killGhost(d, true); return; }
    }
  }
  d.lx = x; d.ly = y;
});
function flyThen(d){
  const tp = targetPoint(d.kind);
  if(!tp || !d.ghost){ killGhost(d, false); unhide(d); doDrop(d); return; }
  const g = d.ghost;
  void g.offsetWidth; g.classList.add('fly');
  g.style.left = tp.x + 'px'; g.style.top = tp.y + 'px';
  setTimeout(function(){ killGhost(d, false); unhide(d); doDrop(d); }, 330);
}
function endDrag(ev, cancel){
  const d = DG; if(!d || ev.pointerId !== d.pid) return;
  DG = null;
  const x = ev.clientX, y = ev.clientY, mouthKind = d.kind==='food' || d.kind==='cup';
  if(d.self){
    d.src.style.transform = ''; d.src.classList.remove('held');
    const pot = $('.pot');
    if(!cancel && (!d.moved || (pot && y >= pot.getBoundingClientRect().top - 12))) doDrop(d);
    return;
  }
  if(cancel || (d.kind==='spoon' && d.moved)){ if(mouthKind) mouthHint(false); killGhost(d, true); unhide(d); return; }
  if(d.moved){
    if(!dropAt(d.kind, x, y)){ if(mouthKind) mouthHint(false); killGhost(d, true); unhide(d); SFX.tok(); }
    else if(mouthKind) flyThen(d);            // 놓은 자리에서 입속으로 쏙 들어가는 모션
    else { killGhost(d, false); doDrop(d); }
    return;
  }
  flyThen(d);                                 // 톡 누르기: 목표 지점으로 날아가서 담기
}
document.addEventListener('pointerup', function(ev){ endDrag(ev, false); });
document.addEventListener('pointercancel', function(ev){ endDrag(ev, true); });

/* ============ 조리 미니게임 ============ */
/* (1) 꾹 눌러 붓기: 누르고 있는 동안 차오르고, 점선 칸 안에서 손을 떼면 성공 */
const POUR = {sugar:[30,42], water:[62,74]};
function startHold(){
  if(S.screen!=='cook' || S.mode!=='tang' || S.cstep!==1 || !S.pour || S.pour.holding) return;
  S.pour.holding = true; S.pour.tick = 0; ac();
  const st = $('#stream'); if(st) st.classList.add('on');
  S.pour.iv = setInterval(function(){
    if(S.screen!=='cook' || S.cstep!==1){ S.pour.holding = false; clearInterval(S.pour.iv); return; }
    S.pour.lvl = Math.min(100, S.pour.lvl + 0.6);
    const e = $('#syr'); if(e) e.style.height = (S.pour.lvl * .7) + '%';
    if(++S.pour.tick % 6 === 0){ if(S.pour.phase==='sugar') SFX.sizzle(); else noise(.14, .1, 'bandpass', 700); }
    if(S.pour.lvl >= 100) endHold();
  }, 30);
}
function endHold(){
  if(!S.pour || !S.pour.holding) return;
  S.pour.holding = false; clearInterval(S.pour.iv);
  const st = $('#stream'); if(st) st.classList.remove('on');
  const b = POUR[S.pour.phase], l = S.pour.lvl, m = $('#cmsg');
  if(l < b[0]){ if(m) m.textContent = '조금 더! 점선 칸까지 꾹 눌러서 부어요'; SFX.tok(); }
  else if(l <= b[1]){
    if(S.pour.phase==='sugar'){ S.pour.phase = 'water'; S.pour.base = l; S.cmsg = '설탕 딱 좋아요! 이제 물을 위쪽 점선 칸까지 부어요 💧'; SFX.jingle(); render(); }
    else { S.cstep = 2; S.cmsg = ''; SFX.jingle(); chat('계량 완벽해! ' + nm.call + ' 요리 천재다!'); render(); }
  } else {
    S.pour.lvl = S.pour.phase==='sugar' ? 0 : S.pour.base;
    S.cmsg = '앗, 넘쳤어요! 점선 칸에 맞춰 다시 부어요'; SFX.buzz(); render();
  }
}
document.addEventListener('pointerdown', function(ev){ if(ev.target.closest('[data-hold]')){ ev.preventDefault(); startHold(); } });
document.addEventListener('pointerup', endHold);
document.addEventListener('pointercancel', endHold);
/* (2) 기포 톡톡: 냄비 위로 올라오는 큰 기포를 8개 터뜨리기 */
function startPop(){
  S.pop = {n:0, miss:0};
  every(function(){
    if(S.screen!=='cook' || S.cstep!==2.5) return;
    const z = $('#popzone'); if(!z || z.children.length >= 3) return;
    const b = document.createElement('button'); b.className = 'pbub'; b.dataset.act = 'popb';
    b.style.left = (6 + Math.random()*70) + '%'; b.style.top = (6 + Math.random()*62) + '%';
    z.appendChild(b); SFX.bubble();
    setTimeout(function(){ if(b.isConnected && !b.dataset.hit){ b.remove(); if(S.pop && S.cstep===2.5) S.pop.miss++; } }, 1800);
  }, 520);
}
/* (3) 카드 짝 맞추기: 같은 재료 카드 두 장씩 찾기 */
function newMatch(){
  const used = [];
  S.dishes.forEach(function(d){ d.of.forEach(function(x){ if(used.indexOf(ING[x].e) < 0) used.push(ING[x].e); }); });
  ['🧀','🍜','🥔','🥛','🍗','🌶️'].forEach(function(e){ if(used.length < 3 && used.indexOf(e) < 0) used.push(e); });
  const es = used.slice(0, 3);
  const mm = S.mm = {cards:es.concat(es).map(function(e){ return {e:e, open:false, done:false}; }).sort(function(){ return Math.random() - .5; }), first:-1, lock:true, miss:0, peek:true};
  setTimeout(function(){ if(S.mm !== mm) return; mm.peek = false; mm.lock = false; if(S.screen==='cook' && S.lstep==='match') render(); }, 2000);
}
function matchHTML(){
  const m = S.mm;
  return '<div class="mm">' + m.cards.map(function(c, i){
    const up = c.open || c.done || m.peek;
    return '<button class="mcard' + (up ? ' up' : '') + (c.done ? ' done' : '') + '" data-act="card" data-i="' + i + '">' + (up ? c.e : '❓') + '</button>';
  }).join('') + '</div>';
}

document.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });

applySkin(); hud();
render();
document.addEventListener('pointerdown', function(){ if(S.screen==='lobby' && !$('.ov')) welcome(); }, {once:true});
</script>
